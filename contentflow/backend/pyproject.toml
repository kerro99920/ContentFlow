[project]
name = "contentflow-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.28",
    "anthropic>=0.87.0",
    "redis>=5.2",
    "python-multipart>=0.0.27",
    "email-validator>=2.2",
    "apscheduler>=3.11.2",
    "aiosmtplib>=5.1.1",
    "playwright>=1.58.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25",
    "pytest-httpx>=0.35",
    "aiosqlite>=0.20",
]
